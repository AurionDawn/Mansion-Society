<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mansion Society | Specialty Coffee Indianapolis</title>
  <meta name="description" content="Latinx and women-owned specialty coffee shop in Indianapolis. Craft coffee rooted in heritage. Brewed with intention. Served with soul.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600;700&family=EB+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #3E2723;
      --secondary: #6B4423;
      --accent: #B8860B;
      --background: #F5F2ED;
      --text: #2C2520;
      --text-muted: #6B5B4F;
      --mansion-brown: #8B735B;
      --terracotta: #8B5A3A;
      --cream: #F5F2ED;
      --divider: #D4C8B8;
      --font-display: "Playfair Display", serif;
      --font-body: "Inter", sans-serif;
      --glass: rgba(245, 242, 237, 0.92);
      --shadow-warm: 0 8px 32px -4px rgba(139, 115, 91, 0.15);
      --shadow-inner: inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      background-color: var(--background);
      color: var(--text);
      line-height: 1.6;
    }
    h1, h2, h3, h4, h5, h6 { font-family: var(--font-display); }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; height: auto; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

    /* Header */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: var(--mansion-brown);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.1);
    }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .logo {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--cream);
    }
    .logo span { color: var(--divider); }
    nav { display: flex; align-items: center; gap: 30px; }
    nav a {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--cream);
      opacity: 0.85;
      transition: all 0.2s;
    }
    nav a:hover, nav a.active { 
      color: var(--cream);
      opacity: 1;
    }
    .btn {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 10px;
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      border: none;
      font-family: var(--font-body);
    }
    .btn-primary {
      background: var(--primary);
      color: var(--cream);
      box-shadow: var(--shadow-warm);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px -4px rgba(62, 39, 35, 0.2);
    }
    .btn-primary:active {
      transform: scale(0.98);
    }
    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--primary);
      color: var(--primary);
    }
    .btn-outline:hover {
      background: var(--primary);
      color: var(--cream);
    }
    .mobile-menu-btn { display: none; font-size: 1.5rem; background: none; border: none; cursor: pointer; }

    /* Hero Section */
    .hero {
      padding: 160px 40px 100px;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      background: var(--background);
    }
    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      max-width: 1400px;
      margin: 0 auto;
      align-items: center;
    }
    .hero-content h1 {
      font-size: 3.5rem;
      font-weight: 600;
      color: var(--primary);
      line-height: 1.1;
      margin-bottom: 20px;
      letter-spacing: -0.02em;
    }
    .hero-content .tagline {
      font-size: 0.85rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--mansion-brown);
      margin-bottom: 16px;
    }
    .hero-content p {
      font-size: 1.05rem;
      color: var(--text-muted);
      margin-bottom: 32px;
      max-width: 480px;
      line-height: 1.7;
    }
    .hero-buttons { display: flex; gap: 16px; margin-bottom: 32px; }
    .hero-info {
      display: flex;
      gap: 32px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .hero-info span { display: flex; align-items: center; gap: 8px; }
    .hero-image {
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow-warm);
      border: 1px solid rgba(139, 115, 91, 0.1);
      position: relative;
    }
    .hero-image::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 12px;
      box-shadow: var(--shadow-inner);
      pointer-events: none;
    }
    .hero-image img {
      width: 100%;
      height: 560px;
      object-fit: cover;
      transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      border-radius: 12px;
    }
    .hero-image:hover img {
      transform: scale(1.03);
    }

    /* Section Styles */
    section { padding: 100px 40px; }
    .section-label {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--mansion-brown);
      margin-bottom: 12px;
    }
    .section-title {
      font-size: 2.5rem;
      font-weight: 500;
      color: var(--primary);
      margin-bottom: 16px;
      letter-spacing: -0.01em;
    }
    .section-subtitle {
      font-size: 1.1rem;
      color: var(--text-muted);
      max-width: 600px;
      line-height: 1.7;
    }
    .divider {
      width: 120px;
      height: 1px;
      background: var(--divider);
      margin: 32px 0;
    }

    /* Carousel */
    .carousel { padding: 100px 40px; background: var(--cream); }
    .carousel-inner {
      max-width: 1100px;
      margin: 0 auto;
      text-align: center;
    }
    .drink-card {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
      margin-top: 50px;
    }
    .drink-image {
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow-warm);
    }
    .drink-image img {
      width: 100%;
      height: 420px;
      object-fit: cover;
      transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      border-radius: 12px;
    }
    .drink-image:hover img {
      transform: scale(1.03);
    }
    .drink-details { text-align: left; }
    .drink-details h3 {
      font-size: 2rem;
      font-weight: 500;
      color: var(--primary);
      margin-bottom: 8px;
    }
    .drink-tagline {
      font-size: 1rem;
      font-style: italic;
      color: var(--mansion-brown);
      margin-bottom: 16px;
    }
    .drink-description {
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      line-height: 1.7;
    }
    .drink-ingredients {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }
    .drink-price {
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 500;
      color: var(--primary);
      margin-bottom: 24px;
    }
    .carousel-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-top: 48px;
    }
    .carousel-nav button {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1.5px solid var(--primary);
      background: transparent;
      color: var(--primary);
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .carousel-nav button:hover {
      background: var(--primary);
      color: var(--cream);
      transform: scale(1.05);
    }
    .carousel-nav button:active {
      transform: scale(0.95);
    }
    .carousel-dots {
      display: flex;
      gap: 10px;
    }
    .carousel-dots button {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: none;
      background: #DDD;
      cursor: pointer;
      transition: all 0.2s;
    }
    .carousel-dots button.active {
      background: var(--accent);
      transform: scale(1.2);
    }

    /* Testimonials */
    .testimonials { padding: 100px 40px; background: var(--background); }
    .testimonials-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      margin-top: 50px;
    }
    .testimonial-card {
      background: white;
      padding: 32px;
      border-radius: 10px;
      box-shadow: var(--shadow-warm);
      border: 1px solid rgba(139, 115, 91, 0.08);
      transition: all 0.3s ease;
    }
    .testimonial-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 36px rgba(139, 115, 91, 0.12);
    }
    .stars { color: var(--mansion-brown); margin-bottom: 16px; letter-spacing: 2px; }
    .testimonial-card p {
      font-size: 1rem;
      font-style: italic;
      color: var(--text);
      margin-bottom: 16px;
      line-height: 1.6;
    }
    .testimonial-card .author {
      font-weight: 500;
      color: var(--primary);
    }
    .testimonial-card .role {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* CTA Section */
    .cta-section {
      padding: 100px 40px;
      background: var(--mansion-brown);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .cta-section::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.1);
      pointer-events: none;
    }
    .cta-section h2 {
      font-size: 2.5rem;
      font-weight: 500;
      color: var(--cream);
      margin-bottom: 16px;
    }
    .cta-section p {
      font-size: 1.1rem;
      color: rgba(255,255,255,0.8);
      margin-bottom: 32px;
      line-height: 1.6;
    }
    .cta-buttons {
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    /* About Quick */
    .about-quick {
      padding: 100px 40px;
      background: var(--background);
    }
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      max-width: 1400px;
      margin: 0 auto;
      align-items: center;
    }
    .about-grid img {
      width: 100%;
      height: 460px;
      object-fit: cover;
      border-radius: 10px;
      box-shadow: var(--shadow-warm);
    }
    .about-grid h2 {
      font-size: 2rem;
      font-weight: 500;
      color: var(--primary);
      margin-bottom: 20px;
    }
    .about-grid p {
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.7;
    }
    .link-arrow {
      color: var(--mansion-brown);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: gap 0.3s ease;
    }
    .link-arrow:hover {
      gap: 12px;
    }

    /* Footer Banner */
    .footer-banner {
      padding: 56px 40px;
      background: var(--background);
      text-align: center;
      position: relative;
    }
    .footer-banner p {
      color: var(--primary);
      margin-bottom: 16px;
      font-size: 1.1rem;
      font-weight: 500;
    }
    .footer-banner .btn-primary {
      background: var(--mansion-brown);
      box-shadow: var(--shadow-warm);
    }
    .footer-banner .btn-primary:hover {
      box-shadow: 0 12px 36px rgba(139, 115, 91, 0.2);
    }

    /* Footer */
    footer {
      padding: 80px 40px 40px;
      background: var(--mansion-brown);
      color: var(--cream);
      position: relative;
    }
    footer::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: rgba(0,0,0,0.1);
    }
    .footer-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr 1fr;
      gap: 48px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .footer-col h4 {
      font-size: 0.75rem;
      font-weight: 500;
      margin-bottom: 24px;
      color: var(--cream);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .footer-col p, .footer-col a {
      font-size: 0.9rem;
      color: rgba(245, 242, 237, 0.75);
      margin-bottom: 12px;
      display: block;
      transition: color 0.3s;
    }
    .footer-col a:hover { color: var(--cream); }
    .social-links {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    .social-links a {
      width: 40px;
      height: 40px;
      border: 1px solid rgba(245, 242, 237, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      transition: all 0.3s;
    }
    .social-links a:hover {
      border-color: var(--cream);
      background: rgba(245, 242, 237, 0.1);
    }
    .footer-bottom {
      text-align: center;
      padding-top: 40px;
      margin-top: 48px;
      border-top: 1px solid rgba(0,0,0,0.1);
      font-size: 0.85rem;
      color: rgba(245, 242, 237, 0.5);
    }

    /* Page: Menu */
    .menu-page { padding: 140px 40px 100px; background: var(--background); }
    .menu-header {
      text-align: center;
      margin-bottom: 60px;
    }
    .menu-tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 48px;
    }
    .menu-tabs button {
      padding: 12px 24px;
      border: none;
      background: transparent;
      font-family: var(--font-body);
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.3s ease;
    }
    .menu-tabs button.active {
      background: var(--primary);
      color: var(--cream);
      box-shadow: var(--shadow-warm);
    }
    .menu-tabs button:hover:not(.active) {
      background: rgba(62, 39, 35, 0.06);
      color: var(--primary);
    }
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .menu-item {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: var(--shadow-warm);
      border: 1px solid rgba(139, 115, 91, 0.08);
      transition: all 0.3s ease;
    }
    .menu-item:hover { 
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(139, 115, 91, 0.15);
    }
    .menu-item img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      transition: transform 0.6s ease;
    }
    .menu-item:hover img {
      transform: scale(1.05);
    }
    .menu-item-content { padding: 20px; }
    .menu-item-content h4 {
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--primary);
      margin-bottom: 6px;
    }
    .menu-item-content .price {
      font-family: var(--font-display);
      font-size: 1.25rem;
      color: var(--mansion-brown);
      font-weight: 500;
    }
    .menu-item-content .ingredients {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 10px;
      line-height: 1.5;
    }

    /* Page: Story */
    .story-page { padding: 140px 40px 100px; background: var(--background); }
    .story-hero {
      height: 400px;
      background: linear-gradient(rgba(62, 39, 35, 0.65), rgba(62, 39, 35, 0.75)),
        url('https://d2xsxph8kpxj0f.cloudfront.net/310519663562380946/QYgoq89FNobMaHYhFQovAh/historic_building-PUieQC7XsLeDtNcEMwBj47.webp') center/cover;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--cream);
      margin-bottom: 80px;
      border-radius: 12px;
    }
    .story-hero h1 {
      font-size: 3rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      margin-bottom: 12px;
    }
    .story-content, .why-page, .press-page {
      max-width: 1000px;
      margin: 0 auto;
      text-align: center;
    }
    .story-content .about-grid {
      text-align: left;
      gap: 64px;
    }
    .story-content h2 {
      font-size: 2rem;
      font-weight: 500;
      color: var(--primary);
      margin: 56px 0 24px;
    }
    .story-content p {
      font-size: 1.05rem;
      color: var(--text-muted);
      margin-bottom: 20px;
      line-height: 1.75;
    }
    .values-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      margin: 48px 0;
    }
    .value-card {
      background: white;
      padding: 32px;
      border-radius: 10px;
      text-align: center;
      box-shadow: var(--shadow-warm);
      border: 1px solid rgba(139, 115, 91, 0.08);
      transition: all 0.3s ease;
    }
    .value-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 36px rgba(139, 115, 91, 0.12);
    }
    .value-card h3 {
      font-size: 1.15rem;
      font-weight: 500;
      color: var(--primary);
      margin-bottom: 12px;
    }
    .value-card p {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.6;
    }
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 64px;
      background: var(--primary);
      padding: 48px;
      border-radius: 10px;
      text-align: center;
      margin: 48px 0;
      position: relative;
    }
    .stats-bar div {
      text-align: center;
      color: var(--cream);
    }
    .stats-bar .number {
      font-family: var(--font-display);
      font-size: 2.5rem;
      font-weight: 500;
      color: var(--cream);
    }
    .stats-bar .label {
      font-size: 0.85rem;
      opacity: 0.7;
      margin-top: 4px;
    }
    .quote {
      text-align: center;
      font-style: italic;
      font-size: 1.5rem;
      color: var(--primary);
      padding: 48px;
      border-top: 1px solid var(--divider);
      border-bottom: 1px solid var(--divider);
      margin: 48px 0;
      font-family: var(--font-display);
      line-height: 1.6;
    }

    /* Page: Why Us */
    .why-page { padding: 140px 40px 100px; background: var(--background); }
    .why-header {
      text-align: center;
      margin-bottom: 64px;
    }
    .why-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
      max-width: 1000px;
      margin: 0 auto 64px;
    }
    .why-card {
      background: white;
      padding: 32px;
      border-radius: 10px;
      box-shadow: var(--shadow-warm);
      border: 1px solid rgba(139, 115, 91, 0.08);
      text-align: left;
      transition: all 0.3s ease;
    }
    .why-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 36px rgba(139, 115, 91, 0.12);
    }
    .why-card h3 {
      font-size: 1.2rem;
      font-weight: 500;
      color: var(--primary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .why-card h3::before {
      content: "✓";
      color: var(--mansion-brown);
      font-size: 0.85rem;
      font-weight: bold;
    }
    .why-card p {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.7;
    }

    /* Page: Press */
    .press-page { padding: 140px 40px 100px; background: var(--background); }
    .press-header {
      text-align: center;
      margin-bottom: 64px;
    }
    .press-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .press-card {
      background: white;
      padding: 28px;
      border-radius: 10px;
      box-shadow: var(--shadow-warm);
      border: 1px solid rgba(139, 115, 91, 0.08);
      border-left: 3px solid var(--mansion-brown);
      transition: all 0.3s ease;
    }
    .press-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 36px rgba(139, 115, 91, 0.12);
    }
    .press-card .publication {
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--mansion-brown);
      text-transform: uppercase;
      margin-bottom: 10px;
      letter-spacing: 0.1em;
    }
    .press-card h3 {
      font-size: 1.15rem;
      font-weight: 500;
      color: var(--primary);
      margin-bottom: 12px;
    }
    .press-card p {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      line-height: 1.6;
    }
    .press-card .date {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .press-card a {
      display: inline-block;
      margin-top: 14px;
      color: var(--mansion-brown);

              </div>
              <div class="value-card">
                <h3>Our Values</h3>
                <p>Quality, authenticity, cultural pride, and community-driven commerce. We believe in doing things right, from scratch.</p>
              </div>
              <div class="value-card">
                <h3>Our Impact</h3>
                <p>As a Latinx and women-owned business, we're reshaping what community-driven commerce looks like in Indianapolis.</p>
              </div>
            </div>
            
            <div class="stats-bar" style="text-align: center;">
              <div><p class="number">2021</p><p class="label">Year Founded</p></div>
              <div><p class="number">100%</p><p class="label">Homemade</p></div>
              <div><p class="number">2</p><p class="label">Founders</p></div>
              <div><p class="number">∞</p><p class="label">Community</p></div>
            </div>
            
            <p class="quote">"Mansion Society isn't just a coffee shop — it's a testament to resilience, creativity, and the power of bringing people together."</p>
            
            <div style="text-align: center; padding: 40px;">
              <h3 style="margin-bottom: 20px;">Visit Us</h3>
              <p>202 Steeples Blvd, Indianapolis, IN 46222</p>
              <p>(317) 737-2560</p>
              <p>Tue–Sat 8AM–4PM | Sun 9AM–4PM</p>
              <a href="https://mansion-society.res-menu.net/menu" target="_blank" class="btn btn-primary" style="margin-top: 20px;">Order Now</a>
            </div>
          </div>
        </section>
        ${renderFooter()}
      `;
    }

    function renderWhyUs() {
      return `
        ${renderHeader('why-us')}
        <section class="why-page">
          <div class="why-header">
            <p class="section-label">Why Mansion Society?</p>
            <h1 class="section-title">Here's what makes every sip worth the trip.</h1>
            <p class="section-subtitle">Discover what makes us different from every other coffee shop in Indianapolis.</p>
          </div>
          
          <div class="why-grid">
            <div class="why-card">
              <h3>History Lives Here</h3>
              <p>We didn't just open a coffee shop. We opened one inside a historic mansion — the former administration building of Central State Hospital. Every beam, every brick has a story. And so does every cup we pour.</p>
            </div>
            <div class="why-card">
              <h3>Made From Scratch, Every Day</h3>
              <p>No shortcuts. No premade syrups from a box. We craft our own syrups, sauces, and concentrates in-house so that what you taste is exactly what we intended.</p>
            </div>
            <div class="why-card">
              <h3>A Culture You Can Taste</h3>
              <p>Zorayda and Ana bring their Latinx heritage into everything they create. From the Churro Swirl Latte to the warmth you feel — culture is the ingredient that makes it unforgettable.</p>
            </div>
            <div class="why-card">
              <h3>Women-Owned, Community-Driven</h3>
              <p>Mansion Society is proudly Latinx and women-owned. When you buy a cup here, you're supporting a family-run dream that puts community first, always.</p>
            </div>
          </div>
          
          <div style="text-align: center; padding: 40px;">
            <h2 style="margin-bottom: 20px;">Ready to experience the difference?</h2>
            <div style="display: flex; justify-content: center; gap: 15px;">
              <a href="https://www.doordash.com/store/mansion-society-indianapolis" target="_blank" class="btn btn-primary">Order Online</a>
              <a href="#/" class="btn btn-outline">Visit Us</a>
            </div>
          </div>
        </section>
        ${renderFooter()}
      `;
    }

    function renderPress() {
      return `
        ${renderHeader('press')}
        <section class="press-page">
          <div class="press-header">
            <p class="section-label">In The Press</p>
            <h1 class="section-title">Indianapolis Is Talking</h1>
            <p class="section-subtitle">Awards, features, and recognition from the people and publications that know Indy best.</p>
          </div>
          
          <div class="press-grid">
            ${pressItems.map(item => `
              <div class="press-card">
                <p class="publication">${item.publication}</p>
                <h3>${item.title}</h3>
                <p>${item.excerpt}</p>
                <p class="date">${item.date}</p>
                <a href="#">Read Article →</a>
              </div>
            `).join('')}
          </div>
        </section>
        ${renderFooter()}
      `;
    }

    function render() {
      const hash = window.location.hash || '#/';
      let page = 'home';
      
      if (hash === '#/menu') page = 'menu';
      else if (hash === '#/story') page = 'story';
      else if (hash === '#/why-us') page = 'why-us';
      else if (hash === '#/press') page = 'press';
      
      const pages = {
        home: renderHome(),
        menu: renderMenu(),
        story: renderStory(),
        'why-us': renderWhyUs(),
        press: renderPress()
      };
      
      document.getElementById('root').innerHTML = pages[page];
      window.scrollTo(0, 0);
      
      // Re-attach event listeners after render
      document.getElementById('prev-drink-btn')?.addEventListener('click', prevDrink);
      document.getElementById('next-drink-btn')?.addEventListener('click', nextDrink);
      
      document.querySelectorAll('.drink-dot').forEach(dot => {
        dot.addEventListener('click', () => goToDrink(parseInt(dot.dataset.index)));
      });
      
      document.querySelectorAll('.menu-tab-btn').forEach(btn => {
        btn.addEventListener('click', () => setMenuCategory(btn.dataset.category));
      });
    }

    function nextDrink() {
      currentDrink = (currentDrink + 1) % drinks.length;
      updateDrink();
    }

    function prevDrink() {
      currentDrink = (currentDrink - 1 + drinks.length) % drinks.length;
      updateDrink();
    }

    function goToDrink(index) {
      currentDrink = index;
      updateDrink();
    }

    function updateDrink() {
      const drink = drinks[currentDrink];
      document.getElementById('drink-img').src = drink.image;
      document.getElementById('drink-name').textContent = drink.name;
      document.getElementById('drink-tagline').textContent = drink.tagline;
      document.getElementById('drink-desc').textContent = drink.description;
      document.getElementById('drink-ing').textContent = drink.ingredients;
      document.getElementById('drink-price').textContent = drink.price;
      
      const dots = document.querySelectorAll('.carousel-dots button');
      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === currentDrink);
      });
    }

    function setMenuCategory(category) {
      currentMenuCategory = category;
      render();
    }

    // Auto-advance carousel
    setInterval(() => {
      if (window.location.hash === '#/' || window.location.hash === '') {
        nextDrink();
      }
    }, 6000);

    // Event listeners
    document.addEventListener('click', function(e) {
      // Carousel buttons
      if (e.target.id === 'prev-drink-btn') {
        prevDrink();
      }
      if (e.target.id === 'next-drink-btn') {
        nextDrink();
      }
      // Carousel dots
      if (e.target.classList.contains('drink-dot')) {
        const index = parseInt(e.target.dataset.index);
        goToDrink(index);
      }
      // Menu tabs
      if (e.target.classList.contains('menu-tab-btn')) {
        const category = e.target.dataset.category;
        setMenuCategory(category);
      }
    });

    // Initialize
    window.addEventListener('hashchange', render);
    render();
  </script>
</body>
</html>
